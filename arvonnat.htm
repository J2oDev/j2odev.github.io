        const aktiivisetContainer =
            document.getElementById("aktiiviset-arvonnat");

        const paattyneetContainer =
            document.getElementById("paattyneet-arvonnat");

        const jatkuvatContainer =
            document.getElementById("jatkuvat-arvonnat");

        const storagePrefix = "arvonta-applied-";

        function hasApplied(id) {
            return localStorage.getItem(storagePrefix + id) === "true";
        }

        function setApplied(id, value) {
            if (value) {
                localStorage.setItem(storagePrefix + id, "true");
            } else {
                localStorage.removeItem(storagePrefix + id);
            }
        }

        function createCard(arvonta, ended = false, recurring = false) {
            const wrapper = document.createElement("div");
            wrapper.className = "card-wrapper";

            const card = document.createElement("a");

            card.href = arvonta.link;
            card.target = "_blank";
            card.rel = "noopener noreferrer";

            card.className = `
                giveaway-card
                block
                bg-white
                rounded-2xl
                p-6
                shadow-lg
                border
                border-slate-100
                ${ended ? "opacity-70" : ""}
            `;

            const applied = !ended && hasApplied(arvonta.id);

            if (applied) {
                card.classList.add("applied");
            }

            card.innerHTML = `
                <div class="pointer-events-none">

                    <div class="flex items-start justify-between gap-4">

                        <h2 class="text-2xl font-bold ${
                            ended
                                ? "text-slate-500"
                                : recurring
                                    ? "text-green-500"
                                    : "text-blue-400"
                        }">
                            ${arvonta.title}
                        </h2>

                        ${
                            ended
                                ? `
                                    <span class="shrink-0 text-xs font-bold text-slate-500 bg-slate-200 px-2 py-1 rounded-full">
                                        PÄÄTTYNYT
                                    </span>
                                `
                                : recurring
                                    ? `
                                        <span class="shrink-0 text-xs font-bold text-green-600 bg-green-100 px-2 py-1 rounded-full">
                                            JATKUVA
                                        </span>
                                    `
                                    : ""
                        }

                    </div>

                    <p class="text-lg mt-3 text-slate-700">
                        ${arvonta.description}
                    </p>

                    ${
                        recurring
                            ? `
                                <div class="mt-5 flex items-center justify-between gap-4">
                                    <p class="text-sm text-green-600 font-bold">
                                        Jatkuvasti käynnissä
                                    </p>

                                    <span class="text-green-500 font-bold text-lg">
                                        →
                                    </span>
                                </div>
                            `
                            : `
                                <div class="mt-5 flex items-center justify-between gap-4">
                                    <p class="text-sm text-slate-500">
                                        ${ended ? "Päättyi:" : "Päättyy:"}
                                        <span class="font-bold">
                                            ${new Date(arvonta.ends).toLocaleString("fi-FI")}
                                        </span>
                                    </p>

                                    <span class="${ended ? "text-slate-400" : "text-blue-400"} font-bold text-lg">
                                        →
                                    </span>
                                </div>
                            `
                    }

                    ${
                        !ended
                            ? `
                                <label
                                    class="pointer-events-auto mt-5 flex items-center gap-3 cursor-pointer select-none"
                                    onclick="event.stopPropagation()"
                                    onmousedown="event.stopPropagation()">

                                    <input
                                        type="checkbox"
                                        class="checkbox w-5 h-5 cursor-pointer"
                                        ${applied ? "checked" : ""}
                                        data-arvonta-id="${arvonta.id}">

                                    <span class="text-base text-slate-600">
                                        Olen jo osallistunut tähän arvontaan
                                    </span>

                                </label>
                            `
                            : ""
                    }

                </div>
            `;

            if (!ended) {
                const checkbox = card.querySelector(".checkbox");

                checkbox.addEventListener("change", event => {
                    event.stopPropagation();

                    setApplied(
                        arvonta.id,
                        event.target.checked
                    );

                    if (event.target.checked) {
                        card.classList.add("applied");
                    } else {
                        card.classList.remove("applied");
                    }
                });
            }

            wrapper.appendChild(card);

            return wrapper;
        }

        function addCard(wrapper, container) {
            container.appendChild(wrapper);

            let currentX = 0;
            let currentY = 0;

            const card = wrapper.querySelector(".giveaway-card");

            wrapper.addEventListener("mousemove", event => {
                const rect = wrapper.getBoundingClientRect();

                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                currentX = ((x - centerX) / centerX) * 8;
                currentY = ((y - centerY) / centerY) * -8;

                if (!card.classList.contains("pressed")) {
                    card.style.transform =
                        `rotateX(${currentY}deg) rotateY(${currentX}deg) scale3d(1.02, 1.02, 1.02)`;
                }
            });

            wrapper.addEventListener("mousedown", event => {
                if (event.target.closest("input, label")) {
                    return;
                }

                card.classList.add("pressed");

                card.style.transform =
                    `rotateX(${currentY}deg) rotateY(${currentX}deg) scale3d(0.96, 0.96, 0.96)`;

                card.style.boxShadow =
                    "0 8px 15px rgba(0, 0, 0, 0.15)";
            });

            wrapper.addEventListener("mouseup", event => {
                if (event.target.closest("input, label")) {
                    return;
                }

                card.classList.remove("pressed");

                card.style.transform =
                    `rotateX(${currentY}deg) rotateY(${currentX}deg) scale3d(1.02, 1.02, 1.02)`;

                card.style.boxShadow =
                    "0 20px 40px rgba(0, 0, 0, 0.2)";
            });

            wrapper.addEventListener("mouseleave", () => {
                card.classList.remove("pressed");

                card.style.transform =
                    "rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";

                card.style.boxShadow = "";
            });

            wrapper.addEventListener("touchstart", event => {
                if (event.target.closest("input, label")) {
                    return;
                }

                card.classList.add("pressed");

                card.style.transform =
                    "scale3d(0.96, 0.96, 0.96)";
            }, { passive: true });

            wrapper.addEventListener("touchend", event => {
                if (event.target.closest("input, label")) {
                    return;
                }

                card.classList.remove("pressed");

                card.style.transform =
                    "scale3d(1, 1, 1)";
            }, { passive: true });
        }

        arvonnat.forEach(arvonta => {
            const ended =
                new Date(arvonta.ends).getTime() <= Date.now();

            const card = createCard(arvonta, ended);

            if (ended) {
                addCard(card, paattyneetContainer);
            } else {
                addCard(card, aktiivisetContainer);
            }
        });

        jatkuvatArvonnat.forEach(arvonta => {
            const card = createCard(arvonta, false, true);

            addCard(card, jatkuvatContainer);
        });

        const activeCount = document.querySelectorAll(
            "#aktiiviset-arvonnat .giveaway-card"
        ).length;

        if (activeCount === 0) {
            aktiivisetContainer.innerHTML = `
                <div class="col-span-full text-center py-8 text-slate-500 text-lg">
                    Tällä hetkellä ei ole aktiivisia arvontoja.
                </div>
            `;
        }

        const endedCount = document.querySelectorAll(
            "#paattyneet-arvonnat .giveaway-card"
        ).length;

        if (endedCount === 0) {
            paattyneetContainer.innerHTML = `
                <div class="col-span-full text-center py-8 text-slate-400 text-lg">
                    Ei päättyneitä arvontoja.
                </div>
            `;
        }

        const recurringCount = document.querySelectorAll(
            "#jatkuvat-arvonnat .giveaway-card"
        ).length;

        if (recurringCount === 0) {
            jatkuvatContainer.innerHTML = `
                <div class="col-span-full text-center py-8 text-slate-400 text-lg">
                    Ei jatkuvia arvontoja.
                </div>
            `;
        }
    </script>
